# mk-brain : configuration matérielle et dispositions de pads.
# Validée par mk_brain.config.Config ; numéros de canal en 1-16.

midi:
  port_hint: Digitakt        # sous-chaîne du nom de port de sortie
  auto_channel: 16           # AUTO CHANNEL de la DT2 (SPEC, décidé le 2026-11-09)
  program_channel: 10        # canal des Program Change (PRG CH SEND / RECEIVE, fiche midi-config)
  fx_channel: 9              # FX CONTROL CH de la DT2 (MIDI CONFIG > CHANNELS) : canal des encodeurs `fx` (FBK)
  knobs_on_track_channel: true   # DT2 PORT CONFIG > OUTPUT CH = TRACK CH : la MK2 suit la track
                                 # active au premier bouton tourné sur la DT2 (2026-11-09)

velocity:
  window_ms: 2.0             # la vélocité = pression maximale sur cette fenêtre après l'attaque
  threshold: 200             # pression d'attaque, sur 4095 (constat slice 0)
  full_scale: 3000           # pression qui donne la vélocité maximale (2500 → 2000 le 2026-11-09 ;
                             # 2000 → 3000 le 2026-11-11 : frappes normales mesurées de 2553 à 3203)
  gamma: 0.4                 # < 1 : remonte les frappes légères (0.6 → 0.4 le 2026-11-09 : 2 à 14 relevés)
  min: 1
  max: 127

aftertouch:                  # pad tenu : sa pression module la track (aftertouch de canal)
  # Mesuré sur la MK2 le 2026-11-11 : frappes de 54 à 80 ms ; pad tenu sans forcer
  # 1340 à 2263 (pointe 2334) ; pad enfoncé 2882 à 3171 (pointe 3213).
  delay_ms: 120              # après la note, pour que la frappe n'en envoie pas (80 → 120)
  threshold: 2350            # au-dessus d'un pad simplement tenu, sur 4095 (900 → 2350)
  full_scale: 3000           # pression qui donne 127 (3600 → 3000, jamais atteint avant)
  interval_ms: 10            # au plus un message par canal sur ce délai

play:
  quantize: "1/16"         # off, 1/16, 1/8 ; GRID fait défiler
  swing: 50                  # 50-75 %, SWING + encodeur maître
  repeat: "1/16"            # division de départ du note repeat
  phrase: 32                 # 32 ou 64 mesures ; sans banque du projet (sinon celle de la banque, 6.B)
  horizon_ms: 20             # note confiée à l'ordonnanceur 20 ms avant sa cible
  tap_debounce_ms: 150       # SOLO, MUTE, SELECT + pad : un pad relâché depuis moins de 150 ms ne rebascule pas

arp:                        # mode ARPG (PATTERN) : réglages de départ (config : PATTERN tenu)
  order: up                  # up, down, updown, played (ordre d'appui), random
  octaves: 1                 # 1 à 3
  gate: 50                   # durée d'une note, 10 à 100 % de la division
  raw_per_choice: 24         # course d'encodeur par valeur de ORD, OCT, MOT, INV, CHD, PRG et BAR (un CC : 15 par cran)
  raw_per_gate_step: 12      # course d'encodeur par pas de 5 % de GATE
  unaccented: 70             # vélocité d'un pas `x` d'un motif, en % de celle du pad (`X` : 100 %)
  chord: "off"               # accord de départ (encodeur 6 CHD) : "off", tri, 7th, sus2, sus4, pwr ; un pad = un accord dans la gamme
  inversion: "off"           # renversement de départ (encodeur 5 INV) : "off", "1", "2" (les 1 ou 2 notes basses de l'accord montent d'une octave), fix (tout reste dans l'octave au-dessus du pad)
  progression: "OFF"         # progression de départ (encodeur 7 PRG) : un nom de `progressions`, ou "OFF"
  bars: "1"                  # durée de chaque accord de la progression (encodeur 8 BAR) : "1/2", "1", "2", "4" mesures
  # Progressions (slice 16) : degrés 1-7 comptés depuis le pad tenu, dans la gamme de la banque
  # (2-4 vers le haut, 5-7 vers le bas). Nom : 4 caractères au plus, entre guillemets.
  progressions:
    "1637": [1, 6, 3, 7]            # i VI III VII
    "1765": [1, 7, 6, 5]            # cadence andalouse
    "1645": [1, 6, 4, 5]
    "1474": [1, 4, 7, 4]
    "1516": [1, 5, 1, 6]
    "1716": [1, 7, 1, 6]
  motif: "OFF"               # motif de départ : un nom de `motifs`, ou "OFF" (une note par division)
  # Motifs (slice 12), encodeur 4 MOT, PATTERN tenu. 1 à 16 pas, en boucle depuis le départ du
  # transport : 16 pas tiennent une mesure en 1/16, un motif plus court tourne contre elle ;
  # les espaces séparent les temps. x note, X note accentuée, . silence, - liée (la note
  # précédente dure un pas de plus), r / R ratchet (la note jouée 2 fois dans le pas, R accentué),
  # t / T idem 3 fois, ? note jouée une fois sur deux. Nom : 4 caractères au plus, entre guillemets.
  motifs:
    "GALO": "X.xx X.xx X.xx X.xx"   # galop
    "OFFB": "..x. ..x. ..x. ..x."   # contretemps
    "TRES": "X..x ..x. X..x ..x."   # tresillo 3-3-2
    "A332": "XxxX xxXx XxxX xxXx"   # continu, accents en 3-3-2
    "SYNC": "x.xX .x.x X.x. .xX."   # syncopes
    "ROLL": "X.x. X.x. X.xx Xxxx"   # roulement en fin de mesure
    "LONG": "X--- x-x- X--- xxx-"   # notes tenues
    "ACID": "X-.x x.X- .xx. X.x-"   # ligne acid, liées et silences
    "RATC": "X.xr X.xx X.xr X.rT"   # galop à ratchets, triolet en fin de mesure
    "HASA": "X.?x ?.x? X.?x ?.??"   # galop troué au hasard
    "CINQ": "X.xx."                 # 5 pas : l'accent tourne contre la mesure
    "DOUZ": "X.xx X.x. X.xr"        # 12 pas : 3 temps contre 4
  # Presets (slices 13 et 14), pad n, PATTERN tenu : tous les réglages d'un coup.
  # Ils remplissent les emplacements 1, 2, 3… des 16 pads (16 au plus) ; un emplacement sauvé depuis
  # la MK2 (PATTERN + SHIFT + pad, state/arp-presets.json) l'emporte. Noms U01 à U16 réservés.
  # Champs facultatifs : `chord` (off par défaut ; tri, 7th, sus2, sus4, pwr), `progression`
  # ("OFF" par défaut), `bars` ("1" par défaut) et `inversion` ("off" par défaut).
  # gate par pas de 5 ; division : 1/4, 1/8, 1/8T, 1/16, 1/16T, 1/32, 1/32T, 1/64.
  presets:
    "ACD1": {order: up, octaves: 1, gate: 60, division: "1/16", motif: "ACID"}
    "GAL2": {order: up, octaves: 2, gate: 50, division: "1/16", motif: "GALO"}
    "TRIB": {order: updown, octaves: 2, gate: 40, division: "1/16", motif: "A332"}
    "CTPS": {order: played, octaves: 1, gate: 50, division: "1/16", motif: "OFFB"}
    "RUSH": {order: up, octaves: 3, gate: 30, division: "1/32", motif: "ROLL"}
    "NAPP": {order: updown, octaves: 1, gate: 100, division: "1/8", motif: "LONG"}
    "HASD": {order: random, octaves: 2, gate: 50, division: "1/16", motif: "SYNC"}
    "TRIO": {order: up, octaves: 2, gate: 50, division: "1/16T", motif: "OFF"}

# 8 encodeurs → CC sur le canal de la track sélectionnée (annexe B du manuel DT2,
# refs/ ; fiche cc-nrpn), deux pages, flèches à côté des écrans (2026-11-09), ordre revu le
# même jour puis le 2026-11-10 (page 1 grain et envois, page 2 filtre et modulations) ; les flèches cyclent dans les deux sens.
# DT2 : ENCODER DEST et MUTE DEST = INT + EXT, le Pi apprend les valeurs jouées sur la machine.
# MW et BC n'agissent que si le preset leur assigne des paramètres (menus MODULATION WHEEL
# et BREATH CTRL du preset). PB change toujours la hauteur, de PITCH BEND DEPTH (SOUND SETUP >
# TRACK) ; le menu PITCH BEND du preset n'ajoute que des paramètres modulés en plus.
encoders:
  mute_cc: 94
  raw_per_step: 15           # geste lent : unités brutes par cran de CC, course d'un potard DT2, 17 crans par quart de tour (256 / 17) ; pas minimal de la MK2 : 4
  accel:                     # geste rapide : course plus courte (2026-11-11) ; bloc absent = course fixe
    raw_per_step: 4          # à pleine vitesse : 0-127 en 127 x 4 / 1024 = 0,50 tour (lent : 127 x 15 / 1024 = 1,86 tour)
    slow: 300                # vitesse (unités brutes / s, 1024 = un tour / s) sous laquelle le pas reste lent
    fast: 1500               # vitesse au-dessus de laquelle le pas est rapide ; entre les deux, interpolation
    window_ms: 40            # fenêtre de mesure de la vitesse ; une rotation isolée compte comme lente
  pages:
    - - {name: LVL, cc: 95}                    # niveau de track
      - {name: BR, cc: 54}                     # bit reduction
      - {name: OVER, cc: 57}                   # overdrive de track
      - {name: SRR, cc: 55}                    # sample rate reduction
      - {name: DEL, cc: 84}                    # envoi delay
      - {name: REV, cc: 85}                    # envoi reverb
      - {name: CHO, cc: 12}                    # envoi chorus
      - {name: TUNE, cc: 16, bipolar: true}
    - - {name: LVL, cc: 95}
      - {name: CUT, cc: 74}                    # fréquence du filtre
      - {name: RES, cc: 75}                    # résonance (knob F du filtre)
      - {name: ENV, cc: 77, bipolar: true}     # profondeur d'enveloppe du filtre
      - {name: MW, cc: 1}                      # mod wheel
      - {name: BC, cc: 2}                      # breath controller
      - {name: PB, pitchbend: true, bipolar: true}   # pitch bend, centré
      - {name: FBK, cc: 24, fx: true, max: 125}   # feedback du délai (SEND FX > DELAY > FDBK), global :
                                                  # envoyé sur fx_channel, plafonné à 125 (au-delà le délai s'emballe) ;
                                                  # à la place de PAN (cc 90, bipolar) le 2026-11-11

leds:
  dim: 0.15                  # pad au repos = couleur × dim ; frappé = couleur pleine
  selected: 0.5              # live : pad de la track sélectionnée (encodeurs), entre repos et frappe
  phrase: [0, 255, 0]        # LED GROUP du compteur de phrases (transport lancé)
  phrase_warn: [255, 110, 0] # bloc en cours, dernière mesure avant un cap (orange)
  bank: [255, 255, 255]      # design : GROUP de la banque choisie, les autres en couleur de mode × dim
  perform_idle: [0, 0, 40]   # SOLO (perform verrouillé) : pad hors du groupe, bleu très faible
  perform_on: [0, 255, 0]    # SOLO : pad du groupe (ou tenu), vert vif ; remplace MPC et clavier
  preset: [255, 255, 255]    # ARPG, PATTERN tenu : pad d'un preset occupé (× dim), le courant plein, vide éteint

# Couleurs des rôles de note : tonique partout (B-H), tierce et quinte en gamme (C-H)
roles:
  tonique: [255, 0, 0]
  tierce: [255, 200, 0]
  quinte: [0, 255, 0]

# Couleur des autres notes et du bouton GROUP, par famille :
# chromatique = notes de la gamme (hors gamme éteint au repos, blanc à la frappe),
# gamme = autres degrés des dispositions C-H (une seule famille, 2026-11-09)
families:
  chromatique: [255, 255, 255]
  gamme: [0, 60, 255]

# Couleur de chaque track (SELECT, MUTE, PATTERN tenus : pad n = track n) (grille doctrine §1, révisée 2026-11-07)
track_colors:
  1: [255, 0, 0]       # kick
  2: [255, 0, 0]       # rumble / sub
  3: [255, 80, 0]      # clap / snare
  4: [255, 80, 0]      # perc
  5: [255, 200, 0]     # hats
  6: [255, 200, 0]     # cymbales
  7: [0, 255, 0]       # Id1 appel
  8: [0, 255, 0]       # Id1 réponse
  9: [255, 0, 60]      # basse
  10: [0, 60, 255]     # séquence / lead
  11: [170, 0, 255]    # atmo / drone
  12: [170, 0, 255]    # vocal
  13: [0, 60, 255]     # Id2
  14: [0, 200, 255]    # Id3
  15: [255, 255, 255]  # FX de transition
  16: [40, 40, 40]     # réserve, Preset Pool

# Codes de track affichés à côté de T01-T16 : colonne « Codes » de la grille
# (doctrine §1, digitakt/doctrine.md), les deux premiers au plus
track_names:
  1: BD
  2: RM
  3: SD/CP
  4: TM/PC
  5: HH/OH
  6: CY
  7: BR/DL
  8: BR/DL
  9: BS/BL
  10: ST
  11: PD
  12: VX
  13: BL/ML
  14: ML/BL
  15: FX
  16: RS

# Dispositions du clavier : groupes B-H en tête, reprises du template DT2 Pads (fiche
# controleur-maschine), puis les gammes exotiques, sans groupe.
# `name` s'affiche : anglais, court, sans accent (la police de l'écran n'en a pas).
# `mode` : nom du mode d'une banque de projet (hub des intervalles) ; en design,
# les dispositions se calent sur la tonique de la banque, la chromatique sur sa gamme
layouts:
  - {group: B, name: Chroma, kind: chromatique, mode: chromatique, base: 60, family: chromatique}
  - {group: C, name: Aeolian, kind: gamme, mode: eolien, base: 60, intervals: [0, 2, 3, 5, 7, 8, 10], family: gamme}
  - {group: D, name: Phrygian, kind: gamme, mode: phrygien, base: 60, intervals: [0, 1, 3, 5, 7, 8, 10], family: gamme}
  - {group: E, name: Dorian, kind: gamme, mode: dorien, base: 60, intervals: [0, 2, 3, 5, 7, 9, 10], family: gamme}
  - {group: F, name: Harm. min, kind: gamme, mode: mineur-harmonique, base: 60, intervals: [0, 2, 3, 5, 7, 8, 11], family: gamme}
  - {group: G, name: Phryg. dom, kind: gamme, mode: phrygien-dominant, base: 60, intervals: [0, 1, 4, 5, 7, 8, 10], family: gamme}
  - {group: H, name: Min. penta, kind: gamme, mode: penta-mineure, base: 60, intervals: [0, 3, 5, 7, 10], family: gamme}
  # Gammes exotiques (2026-11-10) : sans groupe ni mode de banque, au menu GAMME seulement,
  # calées sur la tonique de la banque comme les autres.
  - {name: Locrian, kind: gamme, base: 60, intervals: [0, 1, 3, 5, 6, 8, 10], family: gamme}
  - {name: Hung. min, kind: gamme, base: 60, intervals: [0, 2, 3, 6, 7, 8, 11], family: gamme}
  - {name: Dbl harm., kind: gamme, base: 60, intervals: [0, 1, 4, 5, 7, 8, 11], family: gamme}
  - {name: Blues, kind: gamme, base: 60, intervals: [0, 3, 5, 6, 7, 10], family: gamme}
  - {name: Hirajoshi, kind: gamme, base: 60, intervals: [0, 2, 3, 7, 8], family: gamme}
  - {name: In-sen, kind: gamme, base: 60, intervals: [0, 1, 5, 7, 10], family: gamme}
  - {name: Pelog, kind: gamme, base: 60, intervals: [0, 1, 3, 7, 8], family: gamme}
  - {name: Whole tone, kind: gamme, base: 60, intervals: [0, 2, 4, 6, 8, 10], family: gamme}

# Mode MPC (slice 8, SPEC « Mode unique et pads MPC ») : un pad = une tranche
# (machine SLICE, SLICE = NOTE) sur le canal de sa track (grille doctrine §1).
# La note 60 joue la tranche 1 (vérifié le 2026-11-10) ; au-delà de la dernière
# tranche, la note reboucle : la grille doit compter assez de tranches.
# Une track ne joue qu'une voix : OH coupe CH, le clap coupe la snare.
# Lecture MPC : pad 1 en bas à gauche, 16 en haut à droite.
mpc:
  - {pad: 1,  track: 1, note: 60, label: BD,  color: [255, 0, 0]}
  - {pad: 2,  track: 1, note: 61, label: BD2, color: [255, 0, 0]}
  - {pad: 3,  track: 3, note: 60, label: SD,  color: [255, 80, 0]}
  - {pad: 4,  track: 5, note: 60, label: CH1, color: [255, 200, 0]}
  - {pad: 5,  track: 4, note: 60, label: RS,  color: [255, 80, 0]}
  - {pad: 6,  track: 3, note: 62, label: CP,  color: [255, 80, 0]}
  - {pad: 7,  track: 3, note: 61, label: SD2, color: [255, 80, 0]}
  - {pad: 8,  track: 5, note: 61, label: CH,  color: [255, 200, 0]}
  - {pad: 9,  track: 4, note: 61, label: LT,  color: [0, 60, 255]}
  - {pad: 10, track: 4, note: 62, label: MT,  color: [0, 60, 255]}
  - {pad: 11, track: 4, note: 63, label: HT,  color: [0, 60, 255]}
  - {pad: 12, track: 5, note: 62, label: OH,  color: [255, 255, 255]}
  - {pad: 13, track: 6, note: 60, label: CR,  color: [170, 0, 255]}
  - {pad: 14, track: 6, note: 61, label: RD,  color: [170, 0, 255]}
  - {pad: 15, track: 5, note: 63, label: CH2, color: [255, 200, 0]}
  - {pad: 16, track: 5, note: 64, label: OH2, color: [255, 255, 255]}
